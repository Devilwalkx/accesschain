appId: app.devilwalkx.accesschain
name: INFORMATIONAL - live journey (real TfL and OpenStreetMap). Content varies; only that the app shows an answer or a clear notice is checked
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Tell us what you need"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Tell us what you need"
- scrollUntilVisible:
    element: "Save and see my routes"
    direction: DOWN
    timeout: 60000
    speed: 85
- tapOn: "Save and see my routes"
- scrollUntilVisible:
    element: "Yes, use live information"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Yes, use live information"
- scrollUntilVisible:
    element: "Where do you want to go\\?"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Where do you want to go\\?"
- takeScreenshot: 10-live-places
- scrollUntilVisible:
    element: "Tate Modern"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Tate Modern"
- scrollUntilVisible:
    element: "Where are you starting from\\?"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Where are you starting from\\?"
- takeScreenshot: 11-live-start
- scrollUntilVisible:
    element: "London Bridge"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "London Bridge"
# the "Checking the latest information" line goes away when every service has answered or failed (answers vary; nothing is asserted about content)
- extendedWaitUntil:
    notVisible: "Checking the latest information.*"
    timeout: 90000
- takeScreenshot: 12-live-result-top
- scrollUntilVisible:
    element: "Correct entrance"
    direction: DOWN
    timeout: 60000
    speed: 40
- takeScreenshot: 13-live-entrance
- scrollUntilVisible:
    element: "What answered"
    direction: DOWN
    timeout: 90000
    speed: 40
- takeScreenshot: 14-live-what-answered
