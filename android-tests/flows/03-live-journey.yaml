appId: app.devilwalkx.accesschain
name: INFORMATIONAL - live journey (real TfL and OpenStreetMap). Content varies; only that the app shows an answer or a clear notice is checked
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Tell us what you need"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Tell us what you need"
- scrollUntilVisible:
    element: "Save and see my routes"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Save and see my routes"
- scrollUntilVisible:
    element: "Yes, use live information"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Yes, use live information"
- scrollUntilVisible:
    element: "Where do you want to go\\?"
    direction: DOWN
    timeout: 30000
    speed: 30
- assertVisible: "Where do you want to go\\?"
- takeScreenshot: 10-live-places
- scrollUntilVisible:
    element: "Tate Modern"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Tate Modern"
- scrollUntilVisible:
    element: "Where are you starting from\\?"
    direction: DOWN
    timeout: 30000
    speed: 30
- assertVisible: "Where are you starting from\\?"
- takeScreenshot: 11-live-start
- scrollUntilVisible:
    element: "London Bridge"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "London Bridge"
# the "Checking the latest information" line goes away when every service has answered or failed (answers vary; nothing is asserted about content)
- extendedWaitUntil:
    notVisible: "Checking the latest information.*"
    timeout: 90000
- takeScreenshot: 12-live-result-top
# Either real live content is shown or the honest not-checked state is shown. Never a confident route on failure: a fit is never offered.
- scrollUntilVisible:
    element: "Checked (just now|[0-9]+ .* ago)\\."
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "Checked (just now|[0-9]+ .* ago)\\."
- scrollUntilVisible:
    element: ".*(Walk about|Tube|Train|Bus|DLR|Overground|Elizabeth|No step-free route found|couldn't|could not|too slow|not usable).*"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: ".*(Walk about|Tube|Train|Bus|DLR|Overground|Elizabeth|No step-free route found|couldn't|could not|too slow|not usable).*"
- assertNotVisible: "Suits your needs"
- scrollUntilVisible:
    element: "What answered"
    direction: DOWN
    timeout: 90000
    speed: 30
- takeScreenshot: 14-live-what-answered
- scrollUntilVisible:
    element: "TfL journey planner: .*"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "TfL journey planner: .*"
- scrollUntilVisible:
    element: "OpenStreetMap \\(the place\\): .*"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "OpenStreetMap \\(the place\\): .*"
- scrollUntilVisible:
    element: "Transport information: Powered by TfL Open Data.*"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "Transport information: Powered by TfL Open Data.*"
- scrollUntilVisible:
    element: "Place information: © OpenStreetMap contributors.*"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "Place information: © OpenStreetMap contributors.*"
- takeScreenshot: 15-live-attribution
