appId: app.devilwalkx.accesschain
name: System Back steps backwards through the journey flow, then Home, then leaves the app
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Plan a journey"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Plan a journey"
- scrollUntilVisible:
    element: "Yes, use live information"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Yes, use live information"
- scrollUntilVisible:
    element: "Tate Modern"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Tate Modern"
- scrollUntilVisible:
    element: "Where are you starting from\\?"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Where are you starting from\\?"
- scrollUntilVisible:
    element: "London Bridge"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "London Bridge"
- pressKey: back
- scrollUntilVisible:
    element: "Where are you starting from\\?"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Where are you starting from\\?"
- pressKey: back
- scrollUntilVisible:
    element: "Where do you want to go\\?"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Where do you want to go\\?"
- pressKey: back
- scrollUntilVisible:
    element: "Find out if you can get there.*"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Find out if you can get there.*"
- pressKey: back
- assertNotVisible: "Find out if you can get there.*"
