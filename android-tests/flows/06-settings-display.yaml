appId: app.devilwalkx.accesschain
name: Settings - colours, text size and the build identity
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Display"
    direction: DOWN
    timeout: 30000
    speed: 30
- assertVisible: "Display"
- scrollUntilVisible:
    element: "Large text"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Large text"
- takeScreenshot: 30-settings-large
- scrollUntilVisible:
    element: "App ID app.devilwalkx.accesschain"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "App ID app.devilwalkx.accesschain"
- scrollUntilVisible:
    element: "Version 0.2.0.*"
    direction: DOWN
    timeout: 30000
    speed: 30
- assertVisible: "Version 0.2.0.*"
- scrollUntilVisible:
    element: "Commit [0-9a-f]{7}.*"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "Commit [0-9a-f]{7}.*"
- takeScreenshot: 31-about-build
