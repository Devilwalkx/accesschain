appId: app.devilwalkx.accesschain
name: "INFORMATIONAL - location permission refused (also permanently), a clear message and a way forward"
---
- launchApp:
    clearState: true
    permissions:
      location: deny
- scrollUntilVisible:
    element: "Plan a journey"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Plan a journey"
- scrollUntilVisible:
    element: "Yes, use live information"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Yes, use live information"
- scrollUntilVisible:
    element: "Tate Modern"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Tate Modern"
- scrollUntilVisible:
    element: "Your phone will ask permission once.*"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Your phone will ask permission once.*"
- scrollUntilVisible:
    element: "Where I am now"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Where I am now"
- tapOn:
    text: "Don.t allow|Deny|DENY"
    optional: true
- scrollUntilVisible:
    element: "Location was not allowed.*|Location is switched off.*|We couldn't find where you are.*"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Location was not allowed.*|Location is switched off.*|We couldn't find where you are.*"
- takeScreenshot: 40-location-denied-1
- scrollUntilVisible:
    element: "Where I am now"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Where I am now"
- tapOn:
    text: "Don.t allow|Deny|DENY"
    optional: true
- scrollUntilVisible:
    element: "Where I am now"
    direction: DOWN
    timeout: 60000
    speed: 60
- tapOn: "Where I am now"
- tapOn:
    text: "Don.t allow|Deny|DENY"
    optional: true
- scrollUntilVisible:
    element: "London Bridge"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "London Bridge"
- scrollUntilVisible:
    element: "Use this postcode"
    direction: DOWN
    timeout: 30000
    speed: 60
- assertVisible: "Use this postcode"
- takeScreenshot: 41-location-denied-3
