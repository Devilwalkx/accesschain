appId: app.devilwalkx.accesschain
name: "INFORMATIONAL - location permanently denied (revoked with the do-not-ask-again flag by the script), a clear message and a manual start"
---
- launchApp
- scrollUntilVisible:
    element: "Tell us what you need"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Tell us what you need"
- scrollUntilVisible:
    element: "Save and see my routes"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Save and see my routes"
- scrollUntilVisible:
    element: "Yes, use live information"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Yes, use live information"
- scrollUntilVisible:
    element: "Tate Modern"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Tate Modern"
- scrollUntilVisible:
    element: "Where I am now"
    direction: DOWN
    timeout: 60000
    speed: 30
- tapOn: "Where I am now"
# permanent denial: no system dialog appears; the app explains and offers the phone's settings. A dialog, if the phone shows one, is declined.
- tapOn:
    text: "Don.t allow|Deny|DENY"
    optional: true
- scrollUntilVisible:
    element: "Location is switched off.*|Location was not allowed.*|We couldn't find where you are.*"
    direction: DOWN
    timeout: 60000
    speed: 30
- assertVisible: "Location is switched off.*|Location was not allowed.*|We couldn't find where you are.*"
- takeScreenshot: 40-location-denied
# the manual start still works
- scrollUntilVisible:
    element: "London Bridge"
    direction: UP
    timeout: 60000
    speed: 30
- tapOn: "London Bridge"
- extendedWaitUntil:
    notVisible: "Checking the latest information.*"
    timeout: 90000
- assertNotVisible: "Suits your needs"
- takeScreenshot: 41-manual-start-result
