name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web -w @accesschain/mobile
      - run: npx playwright install --with-deps chromium
      - run: npm test -w @accesschain/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: accesschain-web
          path: apps/mobile/dist-web
          retention-days: 14

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Check requested permissions
        working-directory: apps/mobile
        run: |
          grep "uses-permission" android/app/src/main/AndroidManifest.xml
          ! grep -E 'name="android.permission.(RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_BACKGROUND_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)"/>' android/app/src/main/AndroidManifest.xml | grep -v 'tools:node="remove"' || true
      - name: Build release APK (signed with the Android debug key: for testing only)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: accesschain-android-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
