name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web -w @accesschain/mobile
      - run: npx playwright install --with-deps chromium
      - run: npm test -w @accesschain/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: accesschain-web
          path: apps/mobile/dist-web
          retention-days: 14

  live-smoke:
    # Informational: talks to the REAL TfL and OpenStreetMap services from a browser. May fail if a service is down.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build:web -w @accesschain/mobile
      - run: npx playwright install --with-deps chromium
      - name: Live smoke test (real services)
        run: LIVE_SMOKE=1 npx playwright test tests/live.real.spec.ts --project=android-phone
        working-directory: e2e
      - name: "Record what the app own client sends and what the real services return (status codes, headers)"
        if: always()
        run: npm run record:live -w @accesschain/core 2>&1 | tee live-requests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-request-record
          path: live-requests.txt
          retention-days: 14

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # the Gradle bundling step re-reads app.config.js, so the build identity must be visible to the whole job, not just to expo prebuild
      BUILD_COMMIT: ${{ github.sha }}
      BUILD_TIME: ${{ github.event.head_commit.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: "Detect the owner's private signing key (absent means the build stays a test build)"
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "RELEASE_SIGNING=1" >> "$GITHUB_ENV"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Private signing key present: this build will be signed with it."
          else
            echo "No signing secrets: this build is signed with the public Android debug key (test build)."
          fi
      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: npx expo prebuild --platform android --no-install
      - name: "Point Gradle release build at the private key (only when present)"
        if: ${{ env.RELEASE_SIGNING == '1' }}
        working-directory: apps/mobile
        run: node ../../scripts/configure-release-signing.mjs android/app/build.gradle
      - name: Check requested permissions
        working-directory: apps/mobile
        run: |
          grep "uses-permission" android/app/src/main/AndroidManifest.xml
          # INTERNET is expected (live TfL/OpenStreetMap data); anything else beyond coarse location must not appear.
          if grep -E 'uses-permission android:name="android.permission.(RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_BACKGROUND_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|SYSTEM_ALERT_WINDOW|VIBRATE|USE_BIOMETRIC|USE_FINGERPRINT)"' android/app/src/main/AndroidManifest.xml | grep -v 'tools:node="remove"'; then
            echo "Forbidden permission requested"; exit 1
          fi
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Check identity and back-gesture settings
        working-directory: apps/mobile
        run: |
          grep -E 'package="|enableOnBackInvokedCallback|allowBackup' android/app/src/main/AndroidManifest.xml || true
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle
          grep -Eq "applicationId ['\"]app.devilwalkx.accesschain['\"]" android/app/build.gradle
          grep -q 'enableOnBackInvokedCallback="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - name: "Build release APK (signed with the Android debug key, for testing only)"
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the permissions of the built APK (after all libraries are merged)
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion" | tee -a apk-permissions.txt
          # allowed: INTERNET (live data), ACCESS_COARSE_LOCATION (one-shot, on tap) and the app's own signature-level receiver permission that AndroidX adds
          # The Play install-referrer binding permission is added by expo-application, which the app never uses for that purpose; it is blocked in app.json.
          # If it still shows up in the merged APK it is reported loudly here but is not fatal (it is not a runtime permission and grants no data access).
          if grep -q "BIND_GET_INSTALL_REFERRER_SERVICE" apk-permissions.txt; then echo "NOTE: install-referrer binding permission is present in the built APK despite being blocked"; fi
          if grep -E "uses-permission" apk-permissions.txt | grep -vE "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION|android.permission.INTERNET|android.permission.ACCESS_COARSE_LOCATION|BIND_GET_INSTALL_REFERRER_SERVICE"; then echo "The built APK requests a permission that is not allowed"; exit 1; fi
          grep -q "name='app.devilwalkx.accesschain'" apk-permissions.txt
      - name: Record what identifies this APK
        run: BUILD_COMMIT=${{ github.sha }} bash scripts/apk-identity.sh apps/mobile/android/app/build/outputs/apk/release/*.apk | tee build-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: accesschain-build-identity
          path: build-identity.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: accesschain-android-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  android-emulator:
    needs: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api36-pixel6-standard, api: 36, profile: pixel_6, font: "1.0", night: "no" }
          - { name: api29-pixel5-text200-dark, api: 29, profile: pixel_5, font: "2.0", night: "yes" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: accesschain-android-test-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Previous published APK (for the upgrade check; used only if its application id matches)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p prev
          gh release download latest-test-build -p '*.apk' -D prev || echo "no previous release"
          ls -la prev || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/apk/app-release.apk
          PREV_APK: ${{ github.workspace }}/prev/AccessChain-test.apk
          OUT: ${{ github.workspace }}/out
          FONT: ${{ matrix.font }}
          NIGHT: ${{ matrix.night }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash android-tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence-${{ matrix.name }}
          path: out
          retention-days: 30

  publish-evidence:
    # Copies the emulator screenshots, recording and measurements to a branch so they can be read without downloading artifacts.
    if: ${{ always() && github.event_name == 'push' && needs.android-emulator.result != 'skipped' }}
    needs: android-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: emulator-evidence-*
          path: evidence
      - name: Push evidence branch
        run: |
          set -e
          rm -rf /tmp/ev && mkdir -p /tmp/ev && cp -r evidence/. /tmp/ev/
          printf 'Emulator evidence for commit %s (run %s). Emulator results are not physical-device results.\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > /tmp/ev/README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan evidence-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/ev/. .
          git add -A
          git commit -q -m "Emulator evidence for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push -f origin "evidence-tmp:refs/heads/evidence/run-${GITHUB_RUN_NUMBER}"

  publish-release:
    # Keeps a single, always-newest test build on the repo's Releases page (plain .apk, no zip).
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test-and-web.result == 'success' && needs.android-apk.result == 'success' }}
    needs: [test-and-web, android-apk, android-emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: accesschain-android-test-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: accesschain-web
          path: web
      - uses: actions/download-artifact@v4
        with:
          name: accesschain-build-identity
          path: identity
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          cp identity/build-identity.txt build-identity.txt
          if grep -q "PRIVATE release key" build-identity.txt; then NAME=AccessChain.apk; KIND="Release build signed with the owner's private key."; else NAME=AccessChain-test.apk; KIND="Test build, signed with the public Android debug key (not a release key, not for the Play Store)."; fi
          mv out/*.apk "$NAME"
          (cd web && zip -qr ../AccessChain-web.zip .)
          { printf '%s\n\n' "Install $NAME on an Android phone (application id app.devilwalkx.accesschain: a one-time uninstall of any older AccessChain test build is needed). $KIND Live data from TfL and OpenStreetMap varies; the app also has a clearly labelled demonstration. Step by step: GETTING_STARTED.md. Commit ${{ github.sha }}, run ${{ github.run_number }}. Browser tests: ${{ needs.test-and-web.result }}. Android emulator tests (API 36 and API 29, emulators only): ${{ needs.android-emulator.result }}. This asset has NOT been run on a physical phone by anyone, TalkBack was not run, and no independent person has tested or reviewed it. See docs/ANDROID_PASS_REPORT.md for what is and is not tested."; echo 'Build identity (what identifies this exact file):'; echo; sed 's/^/    /' build-identity.txt; } > notes.md
          gh release delete latest-test-build --cleanup-tag --yes || true
          gh release create latest-test-build "$NAME" build-identity.txt AccessChain-web.zip \
            --target "${{ github.sha }}" --prerelease \
            --title "AccessChain build" \
            --notes-file notes.md
