name: probe-service-terms

# Manual, read-only: prints the CURRENT public terms/policy pages of the services this app uses into the job log,
# so a person (or the audit document) can quote them. Nothing here is a legal opinion.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and print policy pages
        continue-on-error: true
        run: |
          UA="AccessChainProbe/0.2 (policy read; github.com/Devilwalkx/accesschain)"
          show() {
            name="$1"; url="$2"; max="${3:-14000}"
            echo "=================== PAGE_BEGIN $name"
            echo "URL: $url"
            code=$(curl -sSL -m 60 -A "$UA" "$url" -o page.html -w "%{http_code} final=%{url_effective}") || code="curl-failed"
            echo "HTTP $code"
            python3 - "$max" <<'PY'
          import re,sys,html
          try:
              s=open("page.html",encoding="utf8",errors="replace").read()
          except Exception as e:
              print("UNREADABLE",e); sys.exit()
          s=re.sub(r"(?is)<(script|style|noscript|svg|nav|footer|header)[^>]*>.*?</\1>"," ",s)
          s=re.sub(r"(?i)<br\s*/?>|</(p|div|li|h[1-6]|tr)>","\n",s)
          s=re.sub(r"<[^>]+>"," ",s)
          s=html.unescape(s)
          s=re.sub(r"[ \t\r\f]+"," ",s)
          s=re.sub(r"\n\s*\n+","\n",s).strip()
          print("CHARS",len(s))
          print(s[:int(sys.argv[1])])
          PY
            echo "=================== PAGE_END $name"
          }
          show nominatim-policy https://operations.osmfoundation.org/policies/nominatim/ 12000
          show osm-api-policy https://operations.osmfoundation.org/policies/api/ 8000
          show osm-tile-policy https://operations.osmfoundation.org/policies/tiles/ 7000
          show osm-copyright https://www.openstreetmap.org/copyright 6000
          show osm-attribution-guidelines https://osmfoundation.org/wiki/Licence/Attribution_Guidelines 8000
          show tfl-transport-data-service https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service 16000
          show tfl-open-data-users https://tfl.gov.uk/info-for/open-data-users/ 6000
          show tfl-api-portal https://api-portal.tfl.gov.uk/ 3000
          show tfl-api-home https://api.tfl.gov.uk/ 3000
      - name: Rate-limit headers from the TfL API (informational)
        continue-on-error: true
        run: |
          curl -sS -m 60 -A "AccessChainProbe/0.2" -D - -o /dev/null "https://api.tfl.gov.uk/Disruptions/Lifts/v2" | head -30
