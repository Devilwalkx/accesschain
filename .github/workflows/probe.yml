name: probe-live-apis

# Manual, read-only probe of public data sources. Runs on GitHub's runners because the build sandbox
# cannot reach these sites. Prints trimmed responses to the log so adapters are written against reality.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: "AccessChainProbe/0.1 (research prototype; contact via GitHub Devilwalkx/accesschain)"
    steps:
      - name: TfL API spec (Journey, lifts, StopPoint)
        run: |
          curl -sS -m 40 -A "$UA" https://api.tfl.gov.uk/swagger/docs/v1 -o swagger.json || echo "swagger fetch failed"
          ls -la swagger.json || true
          jq -r '.paths | keys[] | select(test("Journey|Lift|Disruptions|StopPoint/\\{id\\}$|StopPoint/Search"))' swagger.json | head -40
          echo "--- JourneyResults params"
          jq -r '.paths["/Journey/JourneyResults/{from}/to/{to}"].get.parameters[] | "\(.name) [\(.in)] \(.type // "") \(.description // "" | .[0:90])"' swagger.json
          echo "--- accessibilityPreference enum"
          jq -r '.paths["/Journey/JourneyResults/{from}/to/{to}"].get.parameters[] | select(.name=="accessibilityPreference") | .items.enum // .enum' swagger.json
          echo "--- mobilityProfile / walkingSpeed enums"
          jq -c '.paths["/Journey/JourneyResults/{from}/to/{to}"].get.parameters[] | select(.name=="walkingSpeed" or .name=="mobilityProfile") | {name, enum:(.enum // .items.enum)}' swagger.json
      - name: Live lift disruptions
        run: |
          for u in "https://api.tfl.gov.uk/Disruptions/Lifts/v2" "https://api.tfl.gov.uk/Disruptions/Lifts"; do
            echo "=== $u"
            code=$(curl -sS -m 40 -A "$UA" -o lifts.json -w "%{http_code}" "$u" || true); echo "HTTP $code"
            head -c 1500 lifts.json; echo
            jq 'if type=="array" then {count:length, keys:(.[0]|keys)} else keys end' lifts.json 2>/dev/null || true
          done
      - name: Station accessibility (StopPoint)
        run: |
          for id in 940GZZLULNB 940GZZLUWLO 940GZZLUSWK; do
            echo "=== StopPoint $id"
            curl -sS -m 40 -A "$UA" "https://api.tfl.gov.uk/StopPoint/$id" -o sp.json -w "HTTP %{http_code}\n" || true
            jq '{id, commonName, modes, keys:(keys), additionalCategories:([.additionalProperties[]?.category]|unique), accessibility:[.additionalProperties[]? | select(.category|test("Access|Lift|Step|Facilit";"i")) | {category,key,value}] | .[0:25], placeType, lat, lon}' sp.json
          done
      - name: Journey planner with step-free preference
        run: |
          u="https://api.tfl.gov.uk/Journey/JourneyResults/940GZZLUWLO/to/51.5076,-0.0994?accessibilityPreference=StepFreeToVehicle,StepFreeToPlatform&walkingSpeed=Slow"
          echo "$u"
          curl -sS -m 60 -A "$UA" "$u" -o j.json -w "HTTP %{http_code}\n" || true
          jq 'keys' j.json | head -20
          jq '.journeys[0] | {startDateTime, arrivalDateTime, duration, keys:(keys), legs:[.legs[] | {mode:.mode.id, summary:.instruction.summary, detailed:(.instruction.detailed|.[0:120]), distance, duration, isDisrupted, from:.departurePoint.commonName, to:.arrivalPoint.commonName, legKeys:(keys), steps:([.instruction.steps[]? | {d:.descriptionHeading, t:.description, trackType, skyDirection, streetName}] | .[0:3])}]}' j.json | head -150
          echo "--- ambiguous/other"; jq '[.journeys|length, (.recommendedMaxAgeMinutes // null)]' j.json
      - name: Journey with disambiguation test (coordinates both)
        run: |
          u="https://api.tfl.gov.uk/Journey/JourneyResults/51.5036,-0.1135/to/51.5076,-0.0994?accessibilityPreference=NoSolidStairs&walkingSpeed=Slow"
          curl -sS -m 60 -A "$UA" "$u" -o j2.json -w "HTTP %{http_code}\n" || true
          jq '.journeys[0] | {duration, legs:[.legs[] | {mode:.mode.id, summary:.instruction.summary, distance, steps:([.instruction.steps[]? | {t:.description, trackType, streetName, skyDirection}] | .[0:4])}]}' j2.json | head -60
      - name: OpenStreetMap wheelchair tags near Bankside (Overpass)
        run: |
          q='[out:json][timeout:30];(nwr["wheelchair"]["name"](around:900,51.5045,-0.1000););out tags center meta 400;'
          curl -sS -m 60 -A "$UA" --data-urlencode "data=$q" https://overpass-api.de/api/interpreter -o osm.json -w "HTTP %{http_code}\n" || true
          jq '{count:(.elements|length), osm3s:.osm3s.copyright, wheelchair:([.elements[].tags.wheelchair]|group_by(.)|map({v:.[0],n:length})), withCheckDate:([.elements[]|select(.tags["check_date:wheelchair"] or .tags.check_date)]|length), withDesc:([.elements[]|select(.tags["wheelchair:description"])]|length), amenities:([.elements[].tags|(.tourism // .amenity // .shop // .leisure // "other")]|group_by(.)|map({k:.[0],n:length})|sort_by(-.n)|.[0:12])}' osm.json
          echo "--- sample elements"; jq -c '[.elements[] | select(.tags.name) ][0:6][] | {type, id, ts:.timestamp, user:.user, name:.tags.name, wc:.tags.wheelchair, desc:.tags["wheelchair:description"], checked:(.tags["check_date:wheelchair"]), kind:(.tags.tourism // .tags.amenity // .tags.shop // .tags.leisure), lat:(.lat // .center.lat), lon:(.lat // .center.lon)}' osm.json
          echo "--- elements with names, first 40 names"; jq -r '[.elements[].tags.name] | unique | .[0:40] | join(" | ")' osm.json
      - name: Licence / terms text (TfL data, OpenStreetMap)
        run: |
          for u in "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service" "https://api.tfl.gov.uk/" "https://www.openstreetmap.org/copyright"; do
            echo "=== $u"
            code=$(curl -sSL -m 40 -A "$UA" -o page.html -w "%{http_code}" "$u" || true); echo "HTTP $code"
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' page.html | tr -s ' \n' | grep -iE "licen[cs]e|attribution|redistribut|powered by|rate limit|app_key|commercial|open government|ODbL|share" | head -20
          done
