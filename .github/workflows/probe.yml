name: probe-live-apis

# Manual, read-only probe of public data sources (round 5: one exact journey sample + start station ids).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: "AccessChainProbe/0.1 (research prototype; contact via GitHub Devilwalkx/accesschain)"
    steps:
      - name: R1 exact trimmed journey (London Bridge tube to Tate Modern, step-free)
        continue-on-error: true
        run: |
          u="https://api.tfl.gov.uk/Journey/JourneyResults/940GZZLULNB/to/51.5074,-0.0993?accessibilityPreference=StepFreeToVehicle,StepFreeToPlatform&walkingSpeed=Slow"
          curl -sS -m 60 -A "$UA" "$u" -o j.json -w "HTTP %{http_code}\n"
          echo "FIXTURE_BEGIN"
          jq -c '{journeys:[.journeys[0:1][] | {startDateTime, arrivalDateTime, duration, legs:[.legs[] | {mode:{id:.mode.id}, distance, duration, isDisrupted, instruction:{summary:.instruction.summary, steps:[.instruction.steps[0:2][]? | {description, streetName, distance, turnDirection, trackType}]}, departurePoint:{commonName, naptanId, hubNaptanCode, icsCode, lat, lon}, arrivalPoint:{commonName, naptanId, hubNaptanCode, icsCode, lat, lon}, obstacles:[.obstacles[]?|{type,incline,position,stopId}], disruptions:[.disruptions[]?|{category,description:(.description|.[0:80])}]}]}]}' j.json
          echo "FIXTURE_END"
      - name: R2 not-found body when no step-free journey exists
        continue-on-error: true
        run: |
          curl -sS -m 60 -A "$UA" "https://api.tfl.gov.uk/Journey/JourneyResults/51.5042,-0.1053/to/51.5074,-0.0993?accessibilityPreference=StepFreeToVehicle,StepFreeToPlatform&walkingSpeed=Slow" -o e.json -w "HTTP %{http_code}\n"
          jq -c '{type:.["$type"], exceptionType, httpStatusCode, message, relativeUri}' e.json
      - name: R3 start station ids
        continue-on-error: true
        run: |
          for id in 940GZZLUWLO 940GZZLULNB 940GZZLUSWK 940GZZLUBKF 940GZZLUBOR 940GZZLUWLO; do
            curl -sS -m 60 -A "$UA" "https://api.tfl.gov.uk/Journey/JourneyResults/$id/to/51.5074,-0.0993?accessibilityPreference=StepFreeToVehicle,StepFreeToPlatform&walkingSpeed=Slow" -o j.json -w "$id HTTP %{http_code} "
            jq -c 'if .journeys then {n:(.journeys|length), from:.journeys[0].legs[0].departurePoint.commonName, legs:[.journeys[0].legs[]|.mode.id]} else {msg:(.message // .httpStatusCode // "300?")} end' j.json
          done
